<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Cunning Psychic</title>


<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>

    * {
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        margin: 0;
        font-family: Georgia, serif;
        background: #f5f5f5;
        color: #333;
        line-height: 1.9;
    }

    #progress-container {
        position: fixed;
        top: 0;
        width: 100%;
        height: 5px;
        background: #ddd;
        z-index: 999;
    }

    #progress-bar {
        height: 5px;
        width: 0%;
        background: #2563eb;
    }

    header {
        background: #111827;
        color: white;
        text-align: center;
        padding: 25px;
    }

    header h1 {
        margin: 0;
    }

    .container {
        max-width: 900px;
        margin: auto;
        padding: 20px;
    }

    article {
        background: white;
        padding: 35px;
        border-radius: 8px;
        min-height: 500px;
    }

    article h1,
    article h2,
    article h3 {
        color: #111827;
    }

    article img {
        max-width: 100%;
    }

    .navigation {

        margin-top: 30px;

        display: flex;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;

    }

    .btn {

        text-decoration: none;
        padding: 12px 18px;
        border-radius: 6px;

        background: #2563eb;
        color: white;

    }

    .btn:hover {
        opacity: 0.9;
    }

    .error {

        text-align: center;
        padding: 40px;

    }

    footer {

        text-align: center;
        padding: 30px;
        color: #666;

    }

    @media(max-width:700px){

        article{
            padding:20px;
        }

        .navigation{
            flex-direction:column;
        }

        .btn{
            text-align:center;
        }

    }

</style>

</head>
<body>

<div id="progress-container">
    <div id="progress-bar"></div>
</div>

<header>

<h1>The Cunning Psychic</h1>

</header>

<div class="container">

<article id="content">

    Loading chapter...

</article>

<div class="navigation">

    <a id="prevBtn"
       class="btn"
       href="#">
        ← Previous
    </a>

    <a class="btn"
       href="index.html">
        Home
    </a>

    <a id="nextBtn"
       class="btn"
       href="#">
        Next →
    </a>

</div>

</div>

<footer>

© 2026 Kesava Nittala

</footer>

<script>

const params = new URLSearchParams(window.location.search);

const file = params.get("file") || "chapter1";

const content = document.getElementById("content");

fetch(`chapters/${file}.md`)
.then(response => {

    if(!response.ok){
        throw new Error("Chapter not found");
    }

    return response.text();

})
.then(markdown => {

    content.innerHTML = marked.parse(markdown);

})
.catch(() => {

    content.innerHTML = `
        <div class="error">
            <h2>Chapter Not Found</h2>
            <p>The requested chapter does not exist.</p>
        </div>
    `;

});


const match = file.match(/chapter(\d+)/);

if(match){

    const current = parseInt(match[1]);

    document.getElementById("prevBtn")
        .href = `chapter.html?file=chapter${current - 1}`;

    document.getElementById("nextBtn")
        .href = `chapter.html?file=chapter${current + 1}`;

    if(current === 1){

        document.getElementById("prevBtn")
            .style.visibility = "hidden";

    }

}


window.addEventListener("scroll", () => {

    const winScroll =
        document.documentElement.scrollTop;

    const height =
        document.documentElement.scrollHeight -
        document.documentElement.clientHeight;

    const scrolled =
        (winScroll / height) * 100;

    document.getElementById("progress-bar")
        .style.width = scrolled + "%";

});

</script>

</body>
</html>
